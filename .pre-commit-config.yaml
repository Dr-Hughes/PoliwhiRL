# The project targets Python >=3.14 (see pyproject.toml), and the code uses
# PEP 758 syntax (`except OSError, ValueError:`) that older interpreters
# cannot parse. Pin the hook interpreters to match, otherwise black and
# flake8 fail with E999 on valid project code.
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/psf/black
    rev: "24.10.0"
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v1.2.3
    hooks:
      - id: flake8
        args: ['--ignore=E501,W503,E203']  # This line ignores long line errors
      - id: check-json
      - id: check-xml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: fix-encoding-pragma
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace